<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Sessions</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --sidebar: #efeeea; --border: #e2e0da;
  --text: #1f1e1c; --muted: #75726b; --accent: #c2410c; --accent-soft: #fff1e8;
  --ok: #15803d; --err: #b91c1c; --code: #f1f0ec; --user: #ecebe6;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --panel: #232220; --sidebar: #161513; --border: #34322e;
    --text: #ecebe7; --muted: #9a968d; --accent: #fb923c; --accent-soft: #3a2517;
    --ok: #4ade80; --err: #f87171; --code: #2c2b28; --user: #2e2d2a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--bg); color: var(--text); display: flex;
}
button { font: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* sidebar */
aside {
  width: 272px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100%;
}
.brand { padding: 18px 16px 10px; font-weight: 600; letter-spacing: .2px; }
.new-btn {
  margin: 4px 12px 12px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); text-align: left; box-shadow: var(--shadow);
}
.new-btn:hover { border-color: var(--accent); }
.session-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
.session {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  color: var(--text);
}
.session:hover { background: rgba(127,127,127,.1); }
.session.active { background: var(--panel); box-shadow: var(--shadow); }
.session .meta { flex: 1; min-width: 0; }
.session .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .time { font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse 1.2s infinite; }
.del {
  border: none; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; visibility: hidden;
  font-size: 12px;
}
.session:hover .del, .del.confirm { visibility: visible; }
.del:hover { color: var(--err); }
.del.confirm { color: var(--err); font-weight: 600; }

/* main */
main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
header {
  padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
  min-height: 52px;
}
header .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .status { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
#conversation { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
.column { max-width: 820px; margin: 0 auto; }

.turn { margin-bottom: 28px; }
.prompt { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.prompt .bubble {
  background: var(--user); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%;
  white-space: pre-wrap; word-break: break-word;
}
.badge {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft);
  color: var(--accent); margin-bottom: 4px; font-weight: 600;
}

/* live loop status */
.live {
  border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 10px 14px;
  box-shadow: var(--shadow);
}
.live-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.spinner {
  width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; flex-shrink: 0;
}
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.step { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 13px; }
.step:first-child { border-top: none; }
.step-line { display: flex; align-items: center; gap: 8px; }
.step-icon { width: 16px; text-align: center; flex-shrink: 0; color: var(--muted); }
.step-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
.step-arg { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.step-took { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.step-text { color: var(--muted); white-space: pre-wrap; word-break: break-word; margin-left: 24px; }
.step-out {
  margin: 6px 0 0 24px; background: var(--code); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  max-height: 160px; overflow: auto;
}

/* finished turn */
details.trace { margin-bottom: 10px; }
details.trace > summary {
  cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: inline-flex; align-items: center;
  gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); user-select: none;
}
details.trace > summary::-webkit-details-marker { display: none; }
details.trace > summary::before { content: "▸"; font-size: 10px; }
details.trace[open] > summary::before { content: "▾"; }
details.trace .live { margin-top: 8px; box-shadow: none; }
.reply { white-space: pre-wrap; word-break: break-word; }
.reply pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.reply code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.reply pre code { background: none; padding: 0; }
.error { color: var(--err); background: rgba(185,28,28,.08); border-radius: 8px; padding: 8px 12px; margin-top: 6px;
  white-space: pre-wrap; font-size: 13px; }
.note { color: var(--muted); font-size: 13px; font-style: italic; }

/* permissions */
#permissions .column { display: flex; flex-direction: column; gap: 8px; }
.perm {
  border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 14px;
}
.perm-title { font-weight: 600; margin-bottom: 6px; }
.perm pre {
  margin: 0 0 8px; background: var(--panel); border-radius: 6px; padding: 8px; font-size: 12px; max-height: 180px;
  overflow: auto; white-space: pre-wrap; word-break: break-all;
}
.perm-actions { display: flex; gap: 8px; }
.btn { padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

/* composer */
.composer { padding: 12px 16px 18px; }
#permissions { padding: 0 16px; }
.box {
  display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--border); background: var(--panel);
  border-radius: 12px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
}
.box:focus-within { border-color: var(--accent); }
textarea {
  flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--text); font: inherit;
  max-height: 200px; padding: 6px 0;
}
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }

/* empty state */
.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.welcome h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
.welcome p { color: var(--muted); margin: 0 0 22px; }
.welcome .box { width: min(680px, 100%); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }

@media (max-width: 720px) {
  aside { width: 100%; height: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  body { flex-direction: column; }
  main { height: auto; flex: 1; min-height: 0; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">Agent Sessions</div>
  <button class="new-btn" id="new-btn">＋ 新会话</button>
  <div class="session-list" id="session-list"></div>
</aside>

<main>
  <section class="welcome" id="welcome">
    <h1>开启一个新会话</h1>
    <p>输入任务后直接开始；也可以用 <code>/goal 条件</code> 设定完成条件。</p>
    <form class="box" id="quick-form">
      <textarea id="quick-input" rows="2" placeholder="想让 agent 做什么？"></textarea>
      <button class="btn primary" type="submit">开始</button>
    </form>
    <div class="hint">Enter 发送 · Shift+Enter 换行</div>
  </section>

  <section id="chat" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <div class="title" id="chat-title"></div>
      <div class="status" id="chat-status"></div>
    </header>
    <div id="conversation"><div class="column" id="turns"></div></div>
    <div id="permissions"><div class="column" id="perm-list"></div></div>
    <div class="composer">
      <div class="column">
        <form class="box" id="send-form">
          <textarea id="send-input" rows="1" placeholder="继续对话…"></textarea>
          <button class="btn primary" id="send-btn" type="submit">发送</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { sessions: [], currentId: null, session: null, source: null, pendingDelete: null };

/* ---------- api ---------- */
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let message = res.statusText;
    try { message = (await res.json()).error || message; } catch (_) {}
    throw new Error(message);
  }
  return res.status === 204 || res.status === 202 ? null : res.json();
}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderText(text) {
  // just enough markdown for agent replies: fenced code blocks and inline code
  const parts = String(text ?? "").split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) return "<pre><code>" + esc(part.replace(/^[\w-]*\n/, "")) + "</code></pre>";
    return esc(part).replace(/`([^`\n]+)`/g, "<code>$1</code>");
  }).join("");
}
function relTime(iso) {
  const t = new Date(iso).getTime();
  if (!t) return "";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return new Date(iso).toLocaleDateString();
}
function duration(turn) {
  const a = new Date(turn.started_at).getTime(), b = new Date(turn.ended_at).getTime();
  if (!a || !b || b < a) return "";
  const s = (b - a) / 1000;
  return s < 60 ? s.toFixed(1) + "s" : Math.floor(s / 60) + "m" + Math.round(s % 60) + "s";
}
function shortArg(input) {
  try {
    const obj = JSON.parse(input);
    const first = Object.values(obj)[0];
    return typeof first === "string" ? first : input;
  } catch (_) { return input; }
}
function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 200) + "px"; }
function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }

/* ---------- sidebar ---------- */
async function refreshSessions() {
  try { state.sessions = await api("GET", "/api/sessions"); } catch (e) { console.error(e); return; }
  renderSidebar();
}
function renderSidebar() {
  $("session-list").innerHTML = state.sessions.map((s) => `
    <div class="session ${s.id === state.currentId ? "active" : ""}" data-id="${esc(s.id)}">
      ${s.busy ? '<span class="dot" title="运行中"></span>' : ""}
      <div class="meta">
        <div class="title">${esc(s.title)}</div>
        <div class="time">${relTime(s.updated_at)}</div>
      </div>
      <button class="del ${state.pendingDelete === s.id ? "confirm" : ""}" data-del="${esc(s.id)}"
        title="删除会话">${state.pendingDelete === s.id ? "确认删除" : "✕"}</button>
    </div>`).join("") || '<div class="note" style="padding:8px 10px">还没有会话</div>';
}
$("session-list").addEventListener("click", async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    const id = del.dataset.del;
    if (state.pendingDelete !== id) { state.pendingDelete = id; renderSidebar(); return; }
    state.pendingDelete = null;
    try { await api("DELETE", "/api/sessions/" + id); } catch (err) { alertInline(err.message); }
    if (state.currentId === id) openSession(null);
    refreshSessions();
    return;
  }
  const row = e.target.closest("[data-id]");
  if (row) { state.pendingDelete = null; openSession(row.dataset.id); }
});
$("new-btn").addEventListener("click", () => openSession(null));

/* ---------- session view ---------- */
function openSession(id) {
  if (state.source) { state.source.close(); state.source = null; }
  state.currentId = id;
  state.session = null;
  history.replaceState(null, "", id ? "#" + id : location.pathname);
  $("welcome").classList.toggle("hidden", !!id);
  $("chat").classList.toggle("hidden", !id);
  renderSidebar();
  if (!id) { $("quick-input").focus(); return; }
  $("turns").innerHTML = "";
  $("perm-list").innerHTML = "";
  connect(id);
  $("send-input").focus();
}

function connect(id) {
  const source = new EventSource(`/api/sessions/${id}/events`);
  state.source = source;
  source.onmessage = (msg) => {
    if (state.currentId !== id) return;
    const ev = JSON.parse(msg.data);
    const s = state.session;
    switch (ev.type) {
      case "snapshot":
        state.session = ev.session;
        state.session.turns = state.session.turns || [];
        state.session.permissions = state.session.permissions || [];
        render(true);
        break;
      case "turn": {
        if (!s) return;
        const i = s.turns.findIndex((t) => t.id === ev.turn.id);
        if (i >= 0) s.turns[i] = ev.turn; else s.turns.push(ev.turn);
        renderTurn(ev.turn);
        renderHeader();
        break;
      }
      case "session":
        if (!s) return;
        Object.assign(s, { title: ev.session.title, busy: ev.session.busy, updated_at: ev.session.updated_at });
        renderHeader();
        refreshSessions();
        break;
      case "permission":
        if (!s) return;
        s.permissions.push(ev.permission);
        renderPermissions();
        break;
      case "permission_resolved":
        if (!s) return;
        s.permissions = s.permissions.filter((p) => p.id !== ev.permission_id);
        renderPermissions();
        break;
    }
  };
  source.onerror = () => {
    if (source.readyState === EventSource.CLOSED && state.currentId === id) setTimeout(() => connect(id), 1000);
  };
}

function render(scroll) {
  renderHeader();
  $("turns").innerHTML = state.session.turns.length
    ? ""
    : '<div class="note" style="text-align:center;margin-top:40px">发送第一条消息开始这个会话</div>';
  state.session.turns.forEach((t) => renderTurn(t, false));
  renderPermissions();
  if (scroll) $("conversation").scrollTop = $("conversation").scrollHeight;
}

function renderHeader() {
  const s = state.session;
  if (!s) return;
  $("chat-title").textContent = s.title;
  const running = s.turns.some((t) => t.status === "running");
  $("chat-status").textContent = running ? "agent 运行中…" : s.busy ? "排队中…" : "";
  $("send-btn").disabled = !!s.busy;
}

function renderTurn(turn, keepScroll = true) {
  const conv = $("conversation");
  const stick = nearBottom(conv);
  const placeholder = $("turns").querySelector(".note");
  if (placeholder) placeholder.remove();
  let el = document.querySelector(`.turn[data-turn="${turn.id}"]`);
  const wasOpen = el?.querySelector("details.trace")?.open;
  if (!el) {
    el = document.createElement("div");
    el.className = "turn";
    el.dataset.turn = turn.id;
    $("turns").appendChild(el);
  }
  el.innerHTML = turnHTML(turn, wasOpen);
  if (keepScroll && stick) conv.scrollTop = conv.scrollHeight;
}

function turnHTML(turn, open) {
  const prompt = `
    <div class="prompt"><div class="bubble">${turn.source === "cron" ? '<div class="badge">⏰ 定时任务</div>' : ""}${esc(turn.prompt)}</div></div>`;
  const steps = turn.steps || [];

  if (turn.status === "running") {
    // live: every step so far, plus what the loop is doing right now
    const toolRunning = steps.some((s) => s.kind === "tool" && s.status === "running");
    const now = toolRunning ? "正在执行工具…" : steps.length ? "模型思考中…" : "等待模型响应…";
    return prompt + `
      <div class="live">
        <div class="live-head"><span class="spinner"></span><span>${now}</span>
          <span style="margin-left:auto">${steps.length} 步</span></div>
        ${steps.length ? `<ul class="steps">${steps.map(stepHTML).join("")}</ul>` : ""}
      </div>`;
  }

  // finished: fold the loop away behind one line, show only the result
  const tools = steps.filter((s) => s.kind === "tool").length;
  const took = duration(turn);
  const trace = steps.length ? `
    <details class="trace" ${open ? "open" : ""}>
      <summary>${steps.length} 步 · ${tools} 次工具调用${took ? " · " + took : ""}</summary>
      <div class="live"><ul class="steps">${steps.map(stepHTML).join("")}</ul></div>
    </details>` : "";
  const status = turn.status === "interrupted" ? '<div class="note">这一轮在服务重启时被中断</div>' : "";
  const reply = turn.reply ? `<div class="reply">${renderText(turn.reply)}</div>`
    : (!turn.error && !status ? '<div class="note">（没有文字回复）</div>' : "");
  const error = turn.error ? `<div class="error">${esc(turn.error)}</div>` : "";
  return prompt + trace + reply + status + error;
}

function stepHTML(step) {
  if (step.kind === "model") {
    const text = step.text || step.reasoning;
    return `<li class="step"><div class="step-line"><span class="step-icon">💭</span>
      <span class="step-text" style="margin-left:0">${esc(text)}</span></div></li>`;
  }
  const running = step.status === "running";
  return `<li class="step">
    <div class="step-line">
      <span class="step-icon">${running ? '<span class="spinner" style="display:inline-block"></span>' : "⚙"}</span>
      <span class="step-name">${esc(step.tool)}</span>
      <span class="step-arg" title="${esc(step.input)}">${esc(shortArg(step.input))}</span>
      <span class="step-took">${running ? "运行中" : (step.took_ms ?? 0) + "ms"}</span>
    </div>
    ${!running && step.output ? `<div class="step-out">${esc(step.output)}</div>` : ""}
  </li>`;
}

function renderPermissions() {
  const perms = state.session?.permissions || [];
  $("perm-list").innerHTML = perms.map((p) => `
    <div class="perm">
      <div class="perm-title">🔐 ${esc(p.agent)} 请求运行工具 <code>${esc(p.tool)}</code></div>
      <pre>${esc(p.input)}</pre>
      <div class="perm-actions">
        <button class="btn primary" data-perm="${esc(p.id)}" data-allow="1">允许</button>
        <button class="btn" data-perm="${esc(p.id)}" data-allow="0">拒绝</button>
      </div>
    </div>`).join("");
}
$("perm-list").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-perm]");
  if (!btn) return;
  btn.parentElement.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    await api("POST", `/api/sessions/${state.currentId}/permissions/${btn.dataset.perm}`, { allow: btn.dataset.allow === "1" });
  } catch (err) { alertInline(err.message); }
});

/* ---------- sending ---------- */
function alertInline(message) {
  const target = state.currentId ? $("turns") : $("welcome");
  const el = document.createElement("div");
  el.className = "error";
  el.textContent = message;
  target.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function bindComposer(form, input, onSend) {
  input.addEventListener("input", () => autosize(input));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const prompt = input.value.trim();
    if (!prompt) return;
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      await onSend(prompt);
      input.value = "";
      autosize(input);
    } catch (err) {
      alertInline(err.message);
    } finally {
      button.disabled = false;
    }
  });
}

bindComposer($("quick-form"), $("quick-input"), async (prompt) => {
  const session = await api("POST", "/api/sessions", { prompt });
  await refreshSessions();
  openSession(session.id);
});
bindComposer($("send-form"), $("send-input"), async (prompt) => {
  await api("POST", `/api/sessions/${state.currentId}/messages`, { prompt });
});

/* ---------- boot ---------- */
refreshSessions().then(() => {
  const id = location.hash.slice(1);
  openSession(state.sessions.some((s) => s.id === id) ? id : null);
});
setInterval(refreshSessions, 5000);
</script>
</body>
</html>
